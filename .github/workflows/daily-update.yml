name: Daily Update

on:
  schedule:
    # Zielzeiten: 5:45 und 18:00 Uhr Berliner Zeit. Je zwei Cron-Einträge
    # decken Sommer- (UTC+2) und Winterzeit (UTC+1) ab. build_daily.py prüft
    # die lokale Berliner Uhrzeit und überspringt den Lauf, der nicht passt.
    - cron: "45 3 * * *"  # 5:45 Berlin (UTC+2, Sommerzeit)
    - cron: "45 4 * * *"  # 5:45 Berlin (UTC+1, Winterzeit)
    - cron: "0 16 * * *"  # 18:00 Berlin (UTC+2, Sommerzeit)
    - cron: "0 17 * * *"  # 18:00 Berlin (UTC+1, Winterzeit)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build briefing
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/build_daily.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "Keine Änderungen, nichts zu committen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Tägliches Update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
