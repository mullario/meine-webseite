name: Daily Update

on:
  schedule:
    # Läuft alle 15 Minuten. GitHub verzögert geplante Workflows teils um
    # Stunden, daher kein enges Zeitfenster mehr: build_daily.py prüft anhand
    # einer im Repo gespeicherten State-Datei (.build-state.json), ob die
    # Zielzeit (5:45 / 18:00 Berliner Zeit) für heute schon gebaut wurde, und
    # holt einen verspäteten Lauf beim nächstmöglichen Cron-Tick nach.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build briefing
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/build_daily.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- index.html .build-state.json; then
            echo "Keine Änderungen, nichts zu committen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html .build-state.json
          git commit -m "Tägliches Update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
