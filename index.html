<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meine Webseite</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --fg: #1a1a1a;
    --accent: #4f46e5;
    --card-bg: #ffffff;
    --border: #e5e5e7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f10;
      --fg: #f2f2f3;
      --accent: #818cf8;
      --card-bg: #1a1a1c;
      --border: #2a2a2d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 560px;
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 40px;
    text-align: center;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 2rem;
  }
  p {
    margin: 0 0 8px;
    line-height: 1.6;
    opacity: 0.8;
  }
  .accent {
    color: var(--accent);
  }
  .badge {
    display: inline-block;
    margin-top: 24px;
    font-size: 0.85rem;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--accent);
    color: white;
  }
  .photo {
    width: 100%;
    max-height: 360px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 24px;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="photo" src="hund.jpeg" alt="Schwimmender Hund">
    <h1>Willkommen <span class="accent">👋</span></h1>
    <p>Diese Seite läuft live über GitHub Pages.</p>
    <p>Bearbeite <code>index.html</code> im Repository, um sie auszubauen.</p>
    <span class="badge">Online</span>
  </div>
</body>
</html>
